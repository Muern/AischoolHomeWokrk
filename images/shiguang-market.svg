<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#171610" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 背景与装饰色块 -->
  <rect width="1600" height="900" fill="#f6f3ec"/>
  <circle cx="220" cy="180" r="150" fill="#dfa32b" opacity="0.18"/>
  <circle cx="1460" cy="760" r="190" fill="#e2482d" opacity="0.10"/>
  <text x="60" y="830" font-family="Georgia, serif" font-style="italic" font-size="120" fill="none" stroke="#171610" stroke-width="2" opacity="0.25">market</text>

  <!-- 浏览器窗口 -->
  <g filter="url(#softShadow)">
    <rect x="300" y="90" width="1000" height="720" rx="18" fill="#ffffff" stroke="#e5e0d5"/>
    <!-- 窗口顶栏 -->
    <rect x="300" y="90" width="1000" height="56" rx="18" fill="#f0ece2"/>
    <rect x="300" y="120" width="1000" height="26" fill="#f0ece2"/>
    <circle cx="336" cy="118" r="8" fill="#e2482d"/>
    <circle cx="364" cy="118" r="8" fill="#dfa32b"/>
    <circle cx="392" cy="118" r="8" fill="#2b49c8"/>
    <rect x="700" y="104" width="320" height="28" rx="14" fill="#ffffff"/>
    <text x="860" y="123" font-size="14" fill="#9a958a" text-anchor="middle">shiguang.market</text>
  </g>

  <!-- 站点导航条 -->
  <g>
    <circle cx="360" cy="210" r="14" fill="#e2482d"/>
    <text x="384" y="217" font-size="22" font-weight="bold" fill="#171610">拾光集市</text>
    <!-- 搜索框 -->
    <rect x="560" y="190" width="420" height="40" rx="20" fill="#f6f3ec" stroke="#e5e0d5"/>
    <circle cx="590" cy="210" r="8" fill="none" stroke="#9a958a" stroke-width="2.5"/>
    <line x1="596" y1="216" x2="604" y2="224" stroke="#9a958a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="618" y="216" font-size="16" fill="#9a958a">搜索二手好物：教材 / 单车 / 数码 …</text>
    <!-- 发布按钮与头像 -->
    <rect x="1090" y="190" width="112" height="40" rx="20" fill="#e2482d"/>
    <text x="1146" y="216" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+ 发布</text>
    <circle cx="1240" cy="210" r="18" fill="#2b49c8" opacity="0.85"/>
    <circle cx="1240" cy="204" r="6" fill="#ffffff"/>
    <path d="M1228 218 q12 -10 24 0 v4 h-24 z" fill="#ffffff"/>
  </g>
  <line x1="340" y1="252" x2="1260" y2="252" stroke="#efeade" stroke-width="2"/>

  <!-- 商品卡片网格：2 行 x 3 列 -->
  <!-- 卡片 1：教材 -->
  <g>
    <rect x="340" y="284" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="340" y="284" width="290" height="140" rx="12" fill="#f0e5d8"/>
    <rect x="340" y="404" width="290" height="20" fill="#f0e5d8"/>
    <rect x="420" y="330" width="120" height="18" rx="3" fill="#e2482d"/>
    <rect x="424" y="352" width="120" height="18" rx="3" fill="#2b49c8"/>
    <rect x="428" y="374" width="120" height="18" rx="3" fill="#dfa32b"/>
    <text x="368" y="458" font-size="18" font-weight="bold" fill="#171610">《数据结构》教材</text>
    <text x="368" y="486" font-size="14" fill="#9a958a">九成新 · 有笔记</text>
    <text x="368" y="514" font-size="20" font-weight="bold" fill="#e2482d">¥ 12</text>
    <rect x="560" y="492" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="586" y="510" font-size="13" fill="#5c584d" text-anchor="middle">教材</text>
  </g>

  <!-- 卡片 2：自行车 -->
  <g>
    <rect x="655" y="284" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="655" y="284" width="290" height="140" rx="12" fill="#e8eefc"/>
    <rect x="655" y="404" width="290" height="20" fill="#e8eefc"/>
    <circle cx="730" cy="392" r="26" fill="none" stroke="#171610" stroke-width="5"/>
    <circle cx="870" cy="392" r="26" fill="none" stroke="#171610" stroke-width="5"/>
    <path d="M730 392 L775 340 L840 340 L870 392 M775 340 L800 392 L730 392 M820 336 h22" fill="none" stroke="#e2482d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="683" y="458" font-size="18" font-weight="bold" fill="#171610">山地自行车</text>
    <text x="683" y="486" font-size="14" fill="#9a958a">毕业出 · 可小刀</text>
    <text x="683" y="514" font-size="20" font-weight="bold" fill="#e2482d">¥ 260</text>
    <rect x="875" y="492" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="901" y="510" font-size="13" fill="#5c584d" text-anchor="middle">出行</text>
  </g>

  <!-- 卡片 3：台灯 -->
  <g>
    <rect x="970" y="284" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="970" y="284" width="290" height="140" rx="12" fill="#f7ecd4"/>
    <rect x="970" y="404" width="290" height="20" fill="#f7ecd4"/>
    <path d="M1075 380 L1115 316 L1155 380 Z" fill="#dfa32b"/>
    <rect x="1111" y="316" width="8" height="64" fill="#171610"/>
    <rect x="1080" y="380" width="70" height="10" rx="5" fill="#171610"/>
    <circle cx="1200" cy="330" r="14" fill="#ffffff" opacity="0.7"/>
    <text x="998" y="458" font-size="18" font-weight="bold" fill="#171610">LED 护眼台灯</text>
    <text x="998" y="486" font-size="14" fill="#9a958a">宿舍神器 · 三档调光</text>
    <text x="998" y="514" font-size="20" font-weight="bold" fill="#e2482d">¥ 35</text>
    <rect x="1190" y="492" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="1216" y="510" font-size="13" fill="#5c584d" text-anchor="middle">生活</text>
  </g>

  <!-- 卡片 4：相机 -->
  <g>
    <rect x="340" y="548" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="340" y="548" width="290" height="140" rx="12" fill="#eaf1ea"/>
    <rect x="340" y="668" width="290" height="20" fill="#eaf1ea"/>
    <rect x="430" y="608" width="110" height="66" rx="10" fill="#171610"/>
    <circle cx="485" cy="641" r="22" fill="#f6f3ec"/>
    <circle cx="485" cy="641" r="11" fill="#2b49c8"/>
    <rect x="444" y="598" width="26" height="10" rx="3" fill="#171610"/>
    <text x="368" y="722" font-size="18" font-weight="bold" fill="#171610">微单相机</text>
    <text x="368" y="750" font-size="14" fill="#9a958a">98 新 · 含两个镜头</text>
    <text x="368" y="778" font-size="20" font-weight="bold" fill="#e2482d">¥ 1650</text>
    <rect x="560" y="756" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="586" y="774" font-size="13" fill="#5c584d" text-anchor="middle">数码</text>
  </g>

  <!-- 卡片 5：吉他 -->
  <g>
    <rect x="655" y="548" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="655" y="548" width="290" height="140" rx="12" fill="#f4e6e2"/>
    <rect x="655" y="668" width="290" height="20" fill="#f4e6e2"/>
    <circle cx="770" cy="650" r="30" fill="#dfa32b"/>
    <circle cx="770" cy="650" r="11" fill="#f4e6e2"/>
    <rect x="764" y="576" width="12" height="50" rx="3" fill="#171610"/>
    <rect x="760" y="566" width="20" height="14" rx="3" fill="#171610"/>
    <text x="683" y="722" font-size="18" font-weight="bold" fill="#171610">民谣吉他</text>
    <text x="683" y="750" font-size="14" fill="#9a958a">附赠琴包与拨片</text>
    <text x="683" y="778" font-size="20" font-weight="bold" fill="#e2482d">¥ 180</text>
    <rect x="875" y="756" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="901" y="774" font-size="13" fill="#5c584d" text-anchor="middle">乐器</text>
  </g>

  <!-- 卡片 6：键盘 -->
  <g>
    <rect x="970" y="548" width="290" height="240" rx="12" fill="#ffffff" stroke="#eee9dd"/>
    <rect x="970" y="548" width="290" height="140" rx="12" fill="#ece7f6"/>
    <rect x="970" y="668" width="290" height="20" fill="#ece7f6"/>
    <rect x="1040" y="616" width="150" height="56" rx="8" fill="#171610"/>
    <g fill="#f6f3ec">
      <rect x="1050" y="626" width="18" height="14" rx="3"/><rect x="1074" y="626" width="18" height="14" rx="3"/>
      <rect x="1098" y="626" width="18" height="14" rx="3"/><rect x="1122" y="626" width="18" height="14" rx="3"/>
      <rect x="1146" y="626" width="18" height="14" rx="3"/><rect x="1170" y="626" width="12" height="14" rx="3"/>
      <rect x="1050" y="646" width="42" height="14" rx="3"/><rect x="1098" y="646" width="18" height="14" rx="3"/>
      <rect x="1122" y="646" width="18" height="14" rx="3"/><rect x="1146" y="646" width="36" height="14" rx="3"/>
    </g>
    <text x="998" y="722" font-size="18" font-weight="bold" fill="#171610">机械键盘</text>
    <text x="998" y="750" font-size="14" fill="#9a958a">87 键 · 茶轴</text>
    <text x="998" y="778" font-size="20" font-weight="bold" fill="#e2482d">¥ 210</text>
    <rect x="1190" y="756" width="52" height="26" rx="13" fill="#f6f3ec"/>
    <text x="1216" y="774" font-size="13" fill="#5c584d" text-anchor="middle">数码</text>
  </g>
</svg>
